<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">PHI protection: inspect, block, or transform?</title><desc id="desc">The workshop uses synthetic data and a deliberately narrow MRN detector. An authorized clinician can still receive a content-policy denial; care-team permission does not override it.</desc>
<rect width="1120" height="640" rx="18" fill="#f8fafb"/>
<g font-family="Arial, sans-serif">
<text x="42" y="54" font-size="27" font-weight="700" fill="#123247">PHI protection: inspect, block, or transform?</text>
<text x="42" y="86" font-size="16" fill="#4b6472">The workshop uses synthetic data and a deliberately narrow MRN detector.</text>
<rect x="40" y="120" width="1040" height="82" rx="10" fill="white" stroke="#d4dfe5"/>
<rect x="40" y="120" width="184" height="82" rx="10" fill="#e3f2ef"/>
<text x="60" y="166" font-size="17" font-weight="700" fill="#116858">BENIGN CONTROL</text>
<text x="250" y="151" font-size="19" font-weight="700" fill="#123247">HbA1c 8.2%; eGFR 58</text>
<text x="250" y="179" font-size="16" fill="#4b6472">No MRN pattern: expected NO_MATCH_FOUND for the configured custom detector.</text>
<rect x="40" y="220" width="1040" height="82" rx="10" fill="white" stroke="#d4dfe5"/>
<rect x="40" y="220" width="184" height="82" rx="10" fill="#fee8e4"/>
<text x="60" y="266" font-size="17" font-weight="700" fill="#a23525">SENSITIVE TEST</text>
<text x="250" y="251" font-size="19" font-weight="700" fill="#123247">MRN-448291; HbA1c 8.2%</text>
<text x="250" y="279" font-size="16" fill="#4b6472">HOSPITAL_MRN matches: the strict response template should block the payload.</text>
<rect x="40" y="320" width="1040" height="82" rx="10" fill="white" stroke="#d4dfe5"/>
<rect x="40" y="320" width="184" height="82" rx="10" fill="#fff1d7"/>
<text x="60" y="366" font-size="17" font-weight="700" fill="#805600">REDACTION</text>
<text x="250" y="351" font-size="19" font-weight="700" fill="#123247">Requires an additional de-identification configuration</text>
<text x="250" y="379" font-size="16" fill="#4b6472">Inspect-only findings do not remove identifiers. Verify transformed text at the recipient.</text>
<rect x="40" y="420" width="1040" height="82" rx="10" fill="white" stroke="#d4dfe5"/>
<rect x="40" y="420" width="184" height="82" rx="10" fill="#e6edf6"/>
<text x="60" y="466" font-size="17" font-weight="700" fill="#294d77">LIMIT</text>
<text x="250" y="451" font-size="19" font-weight="700" fill="#123247">MRN detection is not complete PHI detection</text>
<text x="250" y="479" font-size="16" fill="#4b6472">Names, dates, free text, and other identifiers need their own policy and validation.</text>
<text x="42" y="600" font-size="15" fill="#4b6472">An authorized clinician can still receive a content-policy denial; care-team permission does not override it.</text>
</g></svg>