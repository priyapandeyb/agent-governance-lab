<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Private MCP: three independent authorization checks</title><desc id="desc">Agent Identity is authorized by IAP and, as its own OIDC ID token, by Cloud Run IAM; the hospital access token controls patient access. Model Armor screens tool content. A clinician token alone cannot bypass ingress.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42647b"/></marker></defs><rect width="1200" height="820" rx="24" fill="#f2f6f9"/><g font-family="Arial, sans-serif"><text x="35" y="47" font-size="30" fill="#16364b" font-weight="bold">Private MCP: agent identity and clinician checks</text><text x="35" y="80" font-size="18" fill="#16364b" font-weight="normal">Google Cloud deployment • distinct credentials • no public invocation</text><rect x="35" y="120" width="330" height="148" rx="16" fill="#fff" stroke="#c9d7e0"/><text x="53" y="152" font-size="21" fill="#16364b" font-weight="bold">1  Root on Agent Runtime</text><text x="53" y="183" font-size="16" fill="#16364b" font-weight="normal">Agent Identity / SPIFFE principal</text><text x="53" y="208" font-size="16" fill="#16364b" font-weight="normal">Session: hospital access token</text><text x="53" y="233" font-size="16" fill="#16364b" font-weight="normal">Gateway bound to all agent egress</text><rect x="435" y="120" width="730" height="148" rx="16" fill="#eaf2ff" stroke="#c9d7e0"/><text x="453" y="152" font-size="21" fill="#16364b" font-weight="bold">Ingress credential: the agent's own ID token</text><text x="453" y="183" font-size="16" fill="#16364b" font-weight="normal">Agent Identity ADC → fetch_id_token_credentials(audience, bind_id_token=False)</text><text x="453" y="208" font-size="16" fill="#16364b" font-weight="normal">No service account, impersonation, or key; issued by the runtime</text><text x="453" y="233" font-size="16" fill="#16364b" font-weight="normal">Result: Google OIDC ID token, subject = SPIFFE ID; audience = Cloud Run origin, without /mcp</text><path d="M365 191 L435 191" fill="none" stroke="#42647b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="335" width="355" height="153" rx="16" fill="#eaf2ff" stroke="#c9d7e0"/><text x="53" y="367" font-size="21" fill="#16364b" font-weight="bold">2  Agent Gateway + IAP</text><text x="53" y="398" font-size="16" fill="#16364b" font-weight="normal">REQUEST_AUTHZ service extension</text><text x="53" y="423" font-size="16" fill="#16364b" font-weight="normal">This agent + registered MCP target</text><text x="53" y="448" font-size="16" fill="#16364b" font-weight="normal">Exact 5-tool allowlist + readOnly</text><rect x="440" y="335" width="330" height="153" rx="16" fill="#e8f5f0" stroke="#c9d7e0"/><text x="458" y="367" font-size="21" fill="#16364b" font-weight="bold">3  Cloud Run IAM</text><text x="458" y="398" font-size="16" fill="#16364b" font-weight="normal">X-Serverless-Authorization: agent ID token</text><text x="458" y="423" font-size="16" fill="#16364b" font-weight="normal">The agent principal itself holds</text><text x="458" y="448" font-size="16" fill="#16364b" font-weight="normal">run.invoker on this service only</text><rect x="820" y="335" width="345" height="153" rx="16" fill="#e8f5f0" stroke="#c9d7e0"/><text x="838" y="367" font-size="21" fill="#16364b" font-weight="bold">4  MCP application</text><text x="838" y="398" font-size="16" fill="#16364b" font-weight="normal">X-Clinician-Token: hospital token</text><text x="838" y="423" font-size="16" fill="#16364b" font-weight="normal">Verify signature, issuer, aud, expiry</text><text x="838" y="448" font-size="16" fill="#16364b" font-weight="normal">Verified clinician → care-team rows</text><path d="M205 268 L205 335" fill="none" stroke="#42647b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M390 410 L440 410" fill="none" stroke="#42647b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M770 410 L820 410" fill="none" stroke="#42647b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="447" y="306" font-size="16" fill="#16364b" font-weight="normal">ID token authenticates ingress; it does not grant tool or patient access.</text><rect x="35" y="545" width="1130" height="110" rx="16" fill="#fff5df" stroke="#c9d7e0"/><text x="53" y="577" font-size="21" fill="#16364b" font-weight="bold">5  Model Armor content extension</text><text x="53" y="608" font-size="16" fill="#16364b" font-weight="normal">Supported tool requests/results → injection screening; strict response profile → synthetic MRN blocking</text><text x="53" y="633" font-size="16" fill="#16364b" font-weight="normal">A permitted read can still be blocked before its result reaches the model. Retain actual extension evidence.</text><path d="M992 488 L992 545" fill="none" stroke="#42647b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="688" width="1130" height="95" rx="16" fill="#fceced" stroke="#c9d7e0"/><text x="53" y="720" font-size="21" fill="#16364b" font-weight="bold">Negative control: clinician → direct Cloud Run URL</text><text x="53" y="751" font-size="16" fill="#16364b" font-weight="normal">No Google ID token, even with a valid hospital token → 401/403. Private here means IAM-protected, not internal-only.</text></g></svg>