<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1280" height="520" fill="#FBFCFE"/>
  <text x="32" y="58" font-size="18" font-weight="700" fill="#1A2430">Task 5: The specialist&#x27;s contract: A2A and the agent card — The product scenario: the Agent2Agent protocol</text>
  <rect x="32" y="84" width="1216" height="404" rx="10" fill="#FFFFFF" stroke="#C9D4DE" stroke-width="1.5"/>
  <rect x="32" y="84" width="1216" height="50" rx="10" fill="#1A2430"/>
  <rect x="32" y="124" width="1216" height="10" fill="#1A2430"/>
  <text x="48" y="115" font-size="15" font-weight="700" fill="#FFFFFF">A2A element</text>
  <text x="196" y="115" font-size="15" font-weight="700" fill="#FFFFFF">What it is</text>
  <text x="773" y="115" font-size="15" font-weight="700" fill="#FFFFFF">How this lab uses it</text>
  <rect x="33" y="134" width="1214" height="138" fill="#FFFFFF"/>
  <line x1="32" y1="134" x2="1248" y2="134" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="165" font-size="15" font-weight="600" fill="#123247">Agent card</text>
  <text x="196" y="165" font-size="15" font-weight="400" fill="#2B3A48">A JSON document at /.well-known/agent-card.json: name,</text>
  <text x="196" y="187" font-size="15" font-weight="400" fill="#2B3A48">description, the RPC endpoint and protocol version</text>
  <text x="196" y="209" font-size="15" font-weight="400" fill="#2B3A48">(supportedInterfaces[] in A2A 1.0; top-level</text>
  <text x="196" y="231" font-size="15" font-weight="400" fill="#2B3A48">url/protocolVersion in 0.3), capabilities, skills, optionally</text>
  <text x="196" y="253" font-size="15" font-weight="400" fill="#2B3A48">securitySchemes</text>
  <text x="773" y="165" font-size="15" font-weight="400" fill="#2B3A48">Generated by ADK&#x27;s AgentCardBuilder / to_a2a() from</text>
  <text x="773" y="187" font-size="15" font-weight="400" fill="#2B3A48">the specialist&#x27;s own definition; fetched by the root</text>
  <text x="773" y="209" font-size="15" font-weight="400" fill="#2B3A48">agent; registered in Agent Registry as the</text>
  <text x="773" y="231" font-size="15" font-weight="400" fill="#2B3A48">specialist&#x27;s identity</text>
  <rect x="33" y="272" width="1214" height="94" fill="#F4F7FA"/>
  <line x1="32" y1="272" x2="1248" y2="272" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="303" font-size="15" font-weight="600" fill="#123247">message/send</text>
  <text x="196" y="303" font-size="15" font-weight="400" fill="#2B3A48">A JSON-RPC 2.0 call carrying a message with parts</text>
  <text x="773" y="303" font-size="15" font-weight="400" fill="#2B3A48">The delegated question; the reply is an A2A Task</text>
  <text x="773" y="325" font-size="15" font-weight="400" fill="#2B3A48">(with status.state and artifacts) or a direct</text>
  <text x="773" y="347" font-size="15" font-weight="400" fill="#2B3A48">Message</text>
  <rect x="33" y="366" width="1214" height="72" fill="#FFFFFF"/>
  <line x1="32" y1="366" x2="1248" y2="366" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="397" font-size="15" font-weight="600" fill="#123247">Transport</text>
  <text x="196" y="397" font-size="15" font-weight="400" fill="#2B3A48">JSON-RPC over HTTPS (also HTTP+JSON/REST and gRPC bindings)</text>
  <text x="773" y="397" font-size="15" font-weight="400" fill="#2B3A48">JSON-RPC, because that is what the gateway&#x27;s Model</text>
  <text x="773" y="419" font-size="15" font-weight="400" fill="#2B3A48">Armor extension can screen</text>
  <rect x="33" y="438" width="1214" height="49" rx="9" fill="#F4F7FA"/>
  <rect x="33" y="438" width="1214" height="10" fill="#F4F7FA"/>
  <line x1="32" y1="438" x2="1248" y2="438" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="469" font-size="15" font-weight="600" fill="#123247">Versions</text>
  <text x="196" y="469" font-size="15" font-weight="400" fill="#2B3A48">0.3 and 1.0 cards are both accepted by Agent Registry</text>
  <text x="773" y="469" font-size="15" font-weight="400" fill="#2B3A48">The card published here is 1.0</text>
  <line x1="180" y1="84" x2="180" y2="488" stroke="#D9E2EC" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="757" y1="84" x2="757" y2="488" stroke="#D9E2EC" stroke-width="1" stroke-opacity="0.7"/>
  <rect x="32" y="84" width="1216" height="404" rx="10" fill="none" stroke="#C9D4DE" stroke-width="1.5"/>
</svg>
