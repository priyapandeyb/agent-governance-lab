<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 382" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1280" height="382" fill="#FBFCFE"/>
  <text x="32" y="58" font-size="18" font-weight="700" fill="#1A2430">Task 5: The specialist&#x27;s contract: A2A and the agent card — Review the specialist</text>
  <rect x="32" y="84" width="1216" height="266" rx="10" fill="#FFFFFF" stroke="#C9D4DE" stroke-width="1.5"/>
  <rect x="32" y="84" width="1216" height="50" rx="10" fill="#1A2430"/>
  <rect x="32" y="124" width="1216" height="10" fill="#1A2430"/>
  <text x="48" y="115" font-size="15" font-weight="700" fill="#FFFFFF">Field</text>
  <text x="331" y="115" font-size="15" font-weight="700" fill="#FFFFFF">Comes from</text>
  <text x="670" y="115" font-size="15" font-weight="700" fill="#FFFFFF">Who acts on it</text>
  <rect x="33" y="134" width="1214" height="72" fill="#FFFFFF"/>
  <line x1="32" y1="134" x2="1248" y2="134" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="165" font-size="15" font-weight="600" fill="#123247">name, description, skills</text>
  <text x="331" y="165" font-size="15" font-weight="400" fill="#2B3A48">The ADK agent definition</text>
  <text x="670" y="165" font-size="15" font-weight="400" fill="#2B3A48">The root agent&#x27;s planner (whether to delegate); Agent Registry</text>
  <text x="670" y="187" font-size="15" font-weight="400" fill="#2B3A48">(indexed for discovery)</text>
  <rect x="33" y="206" width="1214" height="72" fill="#F4F7FA"/>
  <line x1="32" y1="206" x2="1248" y2="206" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="237" font-size="15" font-weight="600" fill="#123247">supportedInterfaces[].url</text>
  <text x="48" y="259" font-size="15" font-weight="600" fill="#123247">(url in 0.3)</text>
  <text x="331" y="237" font-size="15" font-weight="400" fill="#2B3A48">A2A_HOST/A2A_PROTOCOL/A2A_PORT,</text>
  <text x="331" y="259" font-size="15" font-weight="400" fill="#2B3A48">not the bind address</text>
  <text x="670" y="237" font-size="15" font-weight="400" fill="#2B3A48">The A2A client posts every message/send here; the gateway</text>
  <text x="670" y="259" font-size="15" font-weight="400" fill="#2B3A48">matches this hostname against the registry</text>
  <rect x="33" y="278" width="1214" height="71" rx="9" fill="#FFFFFF"/>
  <rect x="33" y="278" width="1214" height="10" fill="#FFFFFF"/>
  <line x1="32" y1="278" x2="1248" y2="278" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="309" font-size="15" font-weight="600" fill="#123247">securitySchemes (absent)</text>
  <text x="331" y="309" font-size="15" font-weight="400" fill="#2B3A48">You, in production</text>
  <text x="670" y="309" font-size="15" font-weight="400" fill="#2B3A48">Which credential A2A clients must present; the workshop</text>
  <text x="670" y="331" font-size="15" font-weight="400" fill="#2B3A48">specialist is public and synthetic</text>
  <line x1="315" y1="84" x2="315" y2="350" stroke="#D9E2EC" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="654" y1="84" x2="654" y2="350" stroke="#D9E2EC" stroke-width="1" stroke-opacity="0.7"/>
  <rect x="32" y="84" width="1216" height="266" rx="10" fill="none" stroke="#C9D4DE" stroke-width="1.5"/>
</svg>
