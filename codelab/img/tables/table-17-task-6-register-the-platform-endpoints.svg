<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 416" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1280" height="416" fill="#FBFCFE"/>
  <text x="32" y="58" font-size="18" font-weight="700" fill="#1A2430">Task 6: Agent Registry: register the MCP server and the platform endpoints — Register the platform endpoints</text>
  <rect x="32" y="84" width="1216" height="300" rx="10" fill="#FFFFFF" stroke="#C9D4DE" stroke-width="1.5"/>
  <rect x="32" y="84" width="1216" height="50" rx="10" fill="#1A2430"/>
  <rect x="32" y="124" width="1216" height="10" fill="#1A2430"/>
  <text x="48" y="115" font-size="15" font-weight="700" fill="#FFFFFF">Endpoint group</text>
  <text x="637" y="115" font-size="15" font-weight="700" fill="#FFFFFF">Why the agent process calls it</text>
  <rect x="33" y="134" width="1214" height="50" fill="#FFFFFF"/>
  <line x1="32" y1="134" x2="1248" y2="134" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="165" font-size="15" font-weight="600" fill="#123247">agentregistry</text>
  <text x="637" y="165" font-size="15" font-weight="400" fill="#2B3A48">Resolves the MCP toolset by name at startup</text>
  <rect x="33" y="184" width="1214" height="50" fill="#F4F7FA"/>
  <line x1="32" y1="184" x2="1248" y2="184" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="215" font-size="15" font-weight="600" fill="#123247">aiplatform (global, regional, and both .mtls. variants)</text>
  <text x="637" y="215" font-size="15" font-weight="400" fill="#2B3A48">Gemini inference; the SDK may use any of the four hostnames</text>
  <rect x="33" y="234" width="1214" height="50" fill="#FFFFFF"/>
  <line x1="32" y1="234" x2="1248" y2="234" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="265" font-size="15" font-weight="600" fill="#123247">modelarmor (regional)</text>
  <text x="637" y="265" font-size="15" font-weight="400" fill="#2B3A48">The in-agent plugin&#x27;s sanitize calls</text>
  <rect x="33" y="284" width="1214" height="50" fill="#F4F7FA"/>
  <line x1="32" y1="284" x2="1248" y2="284" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="315" font-size="15" font-weight="600" fill="#123247">telemetry, monitoring, cloudtrace (plain and .mtls.), logging</text>
  <text x="637" y="315" font-size="15" font-weight="400" fill="#2B3A48">Exporting traces, logs, and metrics</text>
  <rect x="33" y="334" width="1214" height="49" rx="9" fill="#FFFFFF"/>
  <rect x="33" y="334" width="1214" height="10" fill="#FFFFFF"/>
  <line x1="32" y1="334" x2="1248" y2="334" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="365" font-size="15" font-weight="600" fill="#123247">cloudresourcemanager, iamcredentials (plain and .mtls.)</text>
  <text x="637" y="365" font-size="15" font-weight="400" fill="#2B3A48">The runtime&#x27;s project lookups and credential helpers at startup</text>
  <line x1="621" y1="84" x2="621" y2="384" stroke="#D9E2EC" stroke-width="1" stroke-opacity="0.7"/>
  <rect x="32" y="84" width="1216" height="300" rx="10" fill="none" stroke="#C9D4DE" stroke-width="1.5"/>
