<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 432" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1280" height="432" fill="#FBFCFE"/>
  <text x="32" y="58" font-size="18" font-weight="700" fill="#1A2430">Task 7: Agent Gateway and the IAP extension, in dry run — The product scenario: Agent Gateway, Service Extensions, and IAP</text>
  <rect x="32" y="84" width="1216" height="316" rx="10" fill="#FFFFFF" stroke="#C9D4DE" stroke-width="1.5"/>
  <rect x="32" y="84" width="1216" height="50" rx="10" fill="#1A2430"/>
  <rect x="32" y="124" width="1216" height="10" fill="#1A2430"/>
  <text x="48" y="115" font-size="15" font-weight="700" fill="#FFFFFF">Property</text>
  <text x="335" y="115" font-size="15" font-weight="700" fill="#FFFFFF">What it means for you</text>
  <rect x="33" y="134" width="1214" height="72" fill="#FFFFFF"/>
  <line x1="32" y1="134" x2="1248" y2="134" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="165" font-size="15" font-weight="600" fill="#123247">Default-deny</text>
  <text x="335" y="165" font-size="15" font-weight="400" fill="#2B3A48">A destination must be a registry entry and this agent must hold an egress grant on it, or the call</text>
  <text x="335" y="187" font-size="15" font-weight="400" fill="#2B3A48">returns 403 Egress request is not authorized.</text>
  <rect x="33" y="206" width="1214" height="50" fill="#F4F7FA"/>
  <line x1="32" y1="206" x2="1248" y2="206" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="237" font-size="15" font-weight="600" fill="#123247">Transparent</text>
  <text x="335" y="237" font-size="15" font-weight="400" fill="#2B3A48">The agent&#x27;s MCP client keeps calling the Cloud Run URL; it does not know the gateway exists</text>
  <rect x="33" y="256" width="1214" height="72" fill="#FFFFFF"/>
  <line x1="32" y1="256" x2="1248" y2="256" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="287" font-size="15" font-weight="600" fill="#123247">Protocol-aware</text>
  <text x="335" y="287" font-size="15" font-weight="400" fill="#2B3A48">The gateway terminates and re-originates TLS on the agent&#x27;s egress so it can parse the MCP body and</text>
  <text x="335" y="309" font-size="15" font-weight="400" fill="#2B3A48">see the method and tool name; prebuilt ADK runtimes trust its certificate automatically</text>
  <rect x="33" y="328" width="1214" height="71" rx="9" fill="#F4F7FA"/>
  <rect x="33" y="328" width="1214" height="10" fill="#F4F7FA"/>
  <line x1="32" y1="328" x2="1248" y2="328" stroke="#D9E2EC" stroke-width="1"/>
  <text x="48" y="359" font-size="15" font-weight="600" fill="#123247">Attached to the gateway, not</text>
  <text x="48" y="381" font-size="15" font-weight="600" fill="#123247">to Cloud Run</text>
  <text x="335" y="359" font-size="15" font-weight="400" fill="#2B3A48">The records service is not &quot;behind IAP&quot;; the gateway is the enforcement point and the service</text>
  <text x="335" y="381" font-size="15" font-weight="400" fill="#2B3A48">receives whatever the gateway forwards</text>
  <line x1="319" y1="84" x2="319" y2="400" stroke="#D9E2EC" stroke-width="1" stroke-opacity="0.7"/>
  <rect x="32" y="84" width="1216" height="316" rx="10" fill="none" stroke="#C9D4DE" stroke-width="1.5"/>
</svg>
