<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1120" height="600" fill="#FBFCFE"/>
  <text x="34" y="42" font-size="22" font-weight="700" fill="#1A2430">Three identities, three authorities, three decisions</text>
  <text x="34" y="66" font-size="13.5" fill="#5B6B7A">Every answer threads through all three. Each is verified by a different system and decides one thing it alone controls.</text>

  <!-- Clinician card -->
  <rect x="34" y="96" width="340" height="384" rx="12" fill="#FBF3DE" stroke="#E4C873" stroke-width="1.6"/>
  <text x="54" y="128" font-size="16" font-weight="700" fill="#7A5B00">Clinician (end user)</text>
  <text x="54" y="150" font-size="12" fill="#7A5B00">the human asking the question</text>
  <text x="54" y="188" font-size="11.5" font-weight="700" fill="#5B6B7A">CREDENTIAL</text>
  <text x="54" y="208" font-size="12.5" fill="#1A2430">Hospital-IdP JWT (RS256)</text>
  <text x="54" y="226" font-size="12.5" fill="#1A2430">not a Google credential</text>
  <text x="54" y="244" font-size="12" fill="#5B6B7A">in X-Clinician-Token header</text>
  <text x="54" y="286" font-size="11.5" font-weight="700" fill="#5B6B7A">VERIFIED BY</text>
  <text x="54" y="306" font-size="12.5" fill="#1A2430">MCP server, against the IdP JWKS</text>
  <text x="54" y="324" font-size="12" fill="#5B6B7A">iss + aud + signature + exp</text>
  <text x="54" y="366" font-size="11.5" font-weight="700" fill="#0B5A4E">DECIDES</text>
  <text x="54" y="386" font-size="12.5" fill="#0B5A4E">which patient rows come back</text>
  <text x="54" y="404" font-size="12" fill="#0B5A4E">(care-team check)</text>
  <text x="54" y="442" font-size="11.5" font-weight="700" fill="#9B2D20">CANNOT DECIDE</text>
  <text x="54" y="462" font-size="12.5" fill="#9B2D20">which tools the agent may reach</text>

  <!-- Agent card -->
  <rect x="390" y="96" width="340" height="384" rx="12" fill="#E7F4F0" stroke="#0E7C6B" stroke-width="1.6"/>
  <text x="410" y="128" font-size="16" font-weight="700" fill="#0B5A4E">Clinical assistant agent</text>
  <text x="410" y="150" font-size="12" fill="#0B5A4E">the software acting for the clinician</text>
  <text x="410" y="188" font-size="11.5" font-weight="700" fill="#5B6B7A">CREDENTIAL</text>
  <text x="410" y="208" font-size="12.5" fill="#1A2430">Agent Identity — SPIFFE principal</text>
  <text x="410" y="226" font-size="12.5" fill="#1A2430">cert-bound token, mTLS + DPoP</text>
  <text x="410" y="244" font-size="12" fill="#5B6B7A">platform-managed workload credentials</text>
  <text x="410" y="286" font-size="11.5" font-weight="700" fill="#5B6B7A">VERIFIED BY</text>
  <text x="410" y="306" font-size="12.5" fill="#1A2430">Agent Gateway + IAP extension</text>
  <text x="410" y="324" font-size="12" fill="#5B6B7A">roles/iap.egressor + CEL per tool</text>
  <text x="410" y="366" font-size="11.5" font-weight="700" fill="#0B5A4E">DECIDES</text>
  <text x="410" y="386" font-size="12.5" fill="#0B5A4E">which tools/destinations it may reach</text>
  <text x="410" y="404" font-size="12" fill="#0B5A4E">(and read vs write, per tool)</text>
  <text x="410" y="442" font-size="11.5" font-weight="700" fill="#9B2D20">CANNOT DECIDE</text>
  <text x="410" y="462" font-size="12.5" fill="#9B2D20">which patient rows any clinician sees</text>

  <!-- Operator card -->
  <rect x="746" y="96" width="340" height="384" rx="12" fill="#EEF3F7" stroke="#8FB0C9" stroke-width="1.6"/>
  <text x="766" y="128" font-size="16" font-weight="700" fill="#1A2430">Operator (you)</text>
  <text x="766" y="150" font-size="12" fill="#5B6B7A">the human running gcloud</text>
  <text x="766" y="188" font-size="11.5" font-weight="700" fill="#5B6B7A">CREDENTIAL</text>
  <text x="766" y="208" font-size="12.5" fill="#1A2430">Google account</text>
  <text x="766" y="286" font-size="11.5" font-weight="700" fill="#5B6B7A">VERIFIED BY</text>
  <text x="766" y="306" font-size="12.5" fill="#1A2430">Cloud IAM</text>
  <text x="766" y="366" font-size="11.5" font-weight="700" fill="#0B5A4E">DECIDES</text>
  <text x="766" y="386" font-size="12.5" fill="#0B5A4E">who may build and configure</text>
  <text x="766" y="404" font-size="12.5" fill="#0B5A4E">the stack</text>
  <text x="766" y="442" font-size="11.5" font-weight="700" fill="#9B2D20">CANNOT DECIDE</text>
  <text x="766" y="462" font-size="12.5" fill="#9B2D20">anything at request time</text>

  <!-- banner -->
  <rect x="34" y="512" width="1052" height="56" rx="10" fill="#1A2430"/>
  <text x="560" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Reach is not Read.</text>
  <text x="560" y="559" text-anchor="middle" font-size="12.5" fill="#C9D4DE">A gateway-authorized agent gets zero data without a valid clinician token; a valid clinician token still cannot cross a panel boundary.</text>
</svg>
